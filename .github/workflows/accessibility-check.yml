name: Accessibility change checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [accessibility/validation-errors]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check script.js
